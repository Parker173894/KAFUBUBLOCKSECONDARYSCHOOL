{% extends 'base.html' %}{% block content %}<section class="page"><h2>Edit Pupil Result</h2><p><b>Pupil:</b> {{ result.student_number }} - {{ result.full_name }}</p>
<form method="post" class="form-card wide">
<label>Subject</label><input name="subject" value="{{ result.subject }}" required>
<label>Grade</label><select name="grade">{% for g in GRADES %}<option value="{{ g }}" {% if result.grade==g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select>
<label>Term</label><select name="term">{% for t in TERMS %}<option value="{{ t }}" {% if result.term==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select>
<label>Academic Year</label><input name="academic_year" value="{{ result.academic_year }}" required>
<label>Midterm Test Marks</label><input name="midterm" type="number" min="0" max="100" step="0.01" value="{{ result.midterm }}" required>
<label>End Term Marks</label><input name="end_term" type="number" min="0" max="100" step="0.01" value="{{ result.end_term }}" required>
<p class="hint">The grade and comment will be recalculated automatically after saving.</p>
<button class="btn" type="submit">Save Changes</button><a class="btn secondary" href="{{ url_for('results', grade=result.grade, term=result.term) }}">Cancel</a>
</form></section>{% endblock %}
